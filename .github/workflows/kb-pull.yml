name: Sync knowledge base

# Pulls homiehouse/articles.json from the private auntiehomie/knowledge-base
# repository and opens a pull request when it changed. Needs a repository
# secret KNOWLEDGE_BASE_TOKEN: a fine-grained token with read-only Contents
# access to auntiehomie/knowledge-base and nothing else.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kb-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check for token
        id: token
        env:
          KNOWLEDGE_BASE_TOKEN: ${{ secrets.KNOWLEDGE_BASE_TOKEN }}
        run: |
          if [ -z "$KNOWLEDGE_BASE_TOKEN" ]; then
            echo "::notice::KNOWLEDGE_BASE_TOKEN is not set; skipping knowledge base sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Pull corpus
        if: steps.token.outputs.present == 'true'
        env:
          KNOWLEDGE_BASE_TOKEN: ${{ secrets.KNOWLEDGE_BASE_TOKEN }}
        run: node scripts/pull-knowledge-base.mjs
      - name: Open pull request
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content/knowledge-base/articles.json; then
            echo "No changes."
            exit 0
          fi
          branch="chore/kb-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/content/knowledge-base/articles.json
          git commit -m "Sync knowledge base from auntiehomie/knowledge-base"
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --title "Sync knowledge base" \
              --body "Automated pull of \`homiehouse/articles.json\` from auntiehomie/knowledge-base. Review the new or changed articles before merging; merging deploys them to the Learn Hub and the hourly kb-sync."
          fi
