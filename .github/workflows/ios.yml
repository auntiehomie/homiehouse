name: Native iOS
on:
  pull_request:
    paths: ['ios/**', 'src/app/ios-connect/**', '.github/workflows/ios.yml']
  push:
    branches: [master]
    paths: ['ios/**', 'src/app/ios-connect/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test native client
        run: xcodebuild test -project ios/Homiehouse.xcodeproj -scheme Homiehouse -destination "platform=iOS Simulator,id=$IOS_DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath ios/TestResults.xcresult
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
